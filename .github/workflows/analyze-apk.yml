name: Analyze APK (Decompile)

on:
  push:
    paths:
      - 'decompile/**.apk'
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Tools
        run: |
          mkdir -p bin
          # Apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O bin/apktool.jar
          # JADX
          wget https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O jadx.zip
          unzip jadx.zip -d bin/jadx
          chmod +x bin/jadx/bin/jadx

      - name: Decompile APK (Hybrid)
        run: |
          rm -rf output
          mkdir -p output

          TARGET_FILE="decompile/.target_apk_path.txt"
          TARGET_MODE_FILE="decompile/.target_output_mode.txt"
          APK_FILE=""
          OUTPUT_MODE="full"

          if [ -f "$TARGET_FILE" ]; then
            APK_FILE=$(tr -d '\r\n' < "$TARGET_FILE")
          fi

          if [ -f "$TARGET_MODE_FILE" ]; then
            OUTPUT_MODE=$(tr -d '\r\n' < "$TARGET_MODE_FILE")
          fi

          case "$OUTPUT_MODE" in
            full|java|smali) ;;
            *) OUTPUT_MODE="full" ;;
          esac

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(git show --pretty="" --name-only "$GITHUB_SHA" -- "decompile/*.apk" | head -n 1 | tr -d '\r\n')
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find decompile -maxdepth 1 -type f -name '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          fi
          if [ -z "$APK_FILE" ]; then 
            echo "Nenhum APK encontrado"
            exit 1
          fi

          echo "📦 APK selecionado: $APK_FILE"
          echo "🧩 Modo selecionado: $OUTPUT_MODE"

          if [ "$OUTPUT_MODE" = "full" ] || [ "$OUTPUT_MODE" = "smali" ]; then
            mkdir -p output/smali_original
            echo "🔨 Rodando Apktool (Smali)..."
            java -jar bin/apktool.jar d "$APK_FILE" -o output/smali_original -f
          fi

          if [ "$OUTPUT_MODE" = "full" ] || [ "$OUTPUT_MODE" = "java" ]; then
            mkdir -p output/java_source
            echo "✨ Rodando JADX (Java)..."
            ./bin/jadx/bin/jadx "$APK_FILE" -d output/java_source --no-res --export-gradle
          fi



      - name: Zip Result
        run: |
          cd output
          zip -r ../extracted_source.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: extracted_source.zip
